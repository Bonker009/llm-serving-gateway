services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    platform: linux/amd64
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    extra_hosts:
      # Lets the container reach Ollama/vLLM/Whisper running on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm-db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: litellm-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LITELLM_BASE_URL: "http://litellm:4000"   # reach the gateway over the compose network
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}  # stays server-side; never sent to the browser
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      # --- Server Monitor: let the dashboard read the HOST, not just the container ---
      HOST_PROC: "/host/proc"                    # psutil reads host CPU/mem/procs from here
      HOST_ROOT: "/host/root"                    # host "/" for disk usage + utmp (users)
      NVIDIA_VISIBLE_DEVICES: "all"              # expose all GPUs to nvidia-smi
      NVIDIA_DRIVER_CAPABILITIES: "utility"      # inject the nvidia-smi binary + driver libs
    volumes:
      # Read-only host views for the Server Monitor page. On a Linux host these
      # surface real GPU/CPU/disk/users; on a non-GPU dev box the page simply
      # degrades to whatever is available.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    # GPU access (NVIDIA Container Toolkit). Harmless to leave configured on a box
    # without GPUs — nvidia-smi is just absent and the GPU card shows "unavailable".
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - litellm

  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # MUST match the password in DATABASE_URL
      POSTGRES_DB: litellm
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  litellm_pgdata:
