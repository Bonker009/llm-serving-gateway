# Shared Ollama tuning for multi-tenant serving.
#
# Install on the host (NOT in a container):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Then pin the shared models and confirm they stay resident:
#   ollama pull gemma4:12b
#   ollama pull bge-m3
#   ollama ps          # both should show after a test query, with no unload

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"   # reachable from the LiteLLM container
Environment="OLLAMA_NUM_PARALLEL=4"        # concurrent request slots per model
Environment="OLLAMA_MAX_LOADED_MODELS=3"   # keep gemma + bge (+1 headroom) loaded
Environment="OLLAMA_KEEP_ALIVE=-1"         # never unload between team requests
