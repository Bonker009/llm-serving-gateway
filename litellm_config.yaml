# All config-defined models were removed on request. Add models back here
# (then `docker compose restart litellm`) or create them from the dashboard's
# "Add model" UI (persisted in Postgres via store_model_in_db: true below).
model_list: []

litellm_settings:
  drop_params: true        # silently drop params a given backend doesn't support
  num_retries: 2
  request_timeout: 600     # generous: long generations + whisper transcription
  # telemetry is off by default on self-hosted; left explicit for clarity
  # set_verbose: true      # uncomment for debugging routing issues

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Lets you add/edit models and manage keys from the Admin UI (persisted in Postgres).
  store_model_in_db: true
